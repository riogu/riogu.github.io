baseURL = 'https://riogu.github.io/'
languageCode = 'en-us'
title = 'Egas Ribeiro'
theme = 'PaperMod'
enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

[pagination]
  pagerSize = 10

[params]
  env = 'production'
  description = 'Notes on compilers, static analysis, and GCC internals.'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = false
  ShowToc = true
  capitalizeListTitles = false
  TocOpen = false
  disableSpecial1stPost = true
  hidemeta = false
  comments = false

  [params.homeInfoParams]
    Title = "Egas"
    Content = """
GCC contributor, usually working on the C++ frontend and the static analyzer when I have time.\\
I'm starting the PhD prep phase (MSc) at the Saarbrücken Graduate
School of Computer Science this October to do compiler-related research.

I mostly post about compiler related work and whatever I'm currently working on.\\
See my [GSoC 2026 report](/posts/gsoc-2026/) or the [posts](/posts/) list.
"""

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/riogu'
[[params.socialIcons]]
  name = 'email'
  url = 'mailto:egas.g.ribeiro@gmail.com'

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = false
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true

[[menu.main]]
  identifier = 'posts'
  name = 'Posts'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'about'
  name = 'About'
  url = '/about/'
  weight = 20

[outputs]
  home = ['HTML', 'RSS', 'JSON']
